<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cetak kasir Fazana">
    <title>Cetak kasir Fazana</title>

    <!-- Ikon Aplikasi SVG & Manifest PWA dinamis akan disuntikkan via JS -->
    <link id="appIconLink" rel="icon" type="image/svg+xml">
    <link id="appleTouchIcon" rel="apple-touch-icon">
    <link id="manifestLink" rel="manifest">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & JetBrains Mono untuk Struk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <!-- Library Tesseract.js untuk membaca teks dari gambar/screenshot -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }

        /* Preview Struk Hitam Pekat seperti Kertas Thermal 58mm */
        .receipt-paper {
            font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
            font-size: 11.5px;
            line-height: 1.4;
            font-weight: 800;
            color: #000000;
            background: #ffffff;
            white-space: pre;
            overflow-x: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 4px 10px -2px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .receipt-paper.extradark {
            text-shadow: 0 0 0.6px #000000;
        }

        /* Efek gerigi kertas struk atas & bawah */
        .receipt-paper::before,
        .receipt-paper::after {
            content: "";
            display: block;
            height: 8px;
            width: 100%;
            background-size: 16px 8px;
        }
        .receipt-paper::before {
            background-image: radial-gradient(circle at 8px 0, transparent 6px, #ffffff 6.5px);
            margin-top: -20px;
            margin-bottom: 12px;
        }
        .receipt-paper::after {
            background-image: radial-gradient(circle at 8px 8px, transparent 6px, #ffffff 6.5px);
            margin-bottom: -20px;
            margin-top: 12px;
        }

        /* Aturan Cetak Khusus Kertas Thermal 58mm */
        @media print {
            @page {
                size: 58mm auto;
                margin: 0mm;
            }
            body * {
                visibility: hidden;
            }
            #printableArea, #printableArea * {
                visibility: visible;
            }
            #printableArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 58mm;
                padding: 2mm 3mm;
                margin: 0;
                box-shadow: none !important;
                border: none !important;
                font-size: 10.5px !important;
                line-height: 1.32 !important;
                font-weight: 900 !important;
                color: #000000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            #printableArea::before,
            #printableArea::after {
                display: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Notifikasi Toast Pengganti alert() -->
    <div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md pointer-events-none flex flex-col gap-2"></div>

    <!-- Container Utama Mobile-First -->
    <div class="max-w-lg mx-auto bg-white min-h-screen sm:min-h-0 sm:my-4 sm:rounded-2xl shadow-lg overflow-hidden border border-slate-200">
        
        <!-- Header Aplikasi -->
        <header class="bg-gradient-to-br from-blue-700 via-blue-600 to-indigo-700 text-white p-4 sm:p-5 relative shadow-md">
            <div class="flex items-start justify-between gap-2">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-xl bg-white/15 backdrop-blur-sm border border-white/25 flex items-center justify-center shrink-0 shadow-inner">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z"/>
                        </svg>
                    </div>
                    <div>
                        <span class="inline-block text-[10px] font-bold uppercase tracking-wider bg-blue-900/50 text-blue-100 px-2 py-0.5 rounded-full mb-1">
                            Cetak kasir Fazana
                        </span>
                        <h1 id="shopNameHeader" class="text-lg sm:text-xl font-extrabold leading-tight tracking-tight">Anjad FazAna</h1>
                        <p id="shopAddressHeader" class="text-xs text-blue-100/90 mt-0.5 leading-snug">Pancur Suwang RT035 RW 007 Mayong Jepara</p>
                    </div>
                </div>

                <div class="flex flex-col items-end gap-1.5 shrink-0">
                    <button type="button" onclick="openSettings()" class="bg-white/20 hover:bg-white/30 active:scale-95 transition text-white px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 border border-white/20 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        Toko
                    </button>
                    <button type="button" id="installPwaBtn" onclick="installPWA()" class="hidden bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition text-white px-2.5 py-1.5 rounded-lg text-[11px] font-bold flex items-center gap-1 shadow">
                        📲 Instal App
                    </button>
                </div>
            </div>
        </header>

        <!-- Konten Utama -->
        <main class="p-4 sm:p-5 space-y-5">

            <!-- 1. Pilih Jenis Transaksi -->
            <section>
                <div class="flex items-center justify-between mb-2.5">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">1. Pilih Jenis Transaksi</h2>
                    <span id="activeCatBadge" class="text-[11px] font-semibold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-full border border-blue-200">Perlengkapan Hajatan</span>
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                    <button type="button" class="menu-btn active p-3 rounded-xl border text-xs font-bold text-left transition flex items-center gap-2 bg-blue-600 text-white border-blue-600 shadow-sm" onclick="setCategory('hajatan', 'Perlengkapan Hajatan', this)">
                        <span class="text-base">🎪</span>
                        <span>Perlengkapan Hajatan</span>
                    </button>
                    <button type="button" class="menu-btn p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold text-left transition flex items-center gap-2" onclick="setCategory('listrik', 'Alat-Alat Listrik', this)">
                        <span class="text-base">💡</span>
                        <span>Alat-Alat Listrik</span>
                    </button>
                    <button type="button" class="menu-btn p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold text-left transition flex items-center gap-2" onclick="setCategory('token', 'Token Listrik', this)">
                        <span class="text-base">⚡</span>
                        <span>Token Listrik</span>
                    </button>
                    <button type="button" class="menu-btn p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold text-left transition flex items-center gap-2" onclick="setCategory('pascabayar', 'Listrik Pasca Bayar', this)">
                        <span class="text-base">🧾</span>
                        <span>Listrik Pasca Bayar</span>
                    </button>
                    <button type="button" class="menu-btn col-span-2 p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold text-center transition flex items-center justify-center gap-2" onclick="setCategory('transfer', 'Transfer Bank / E-Wallet', this)">
                        <span class="text-base">💳</span>
                        <span>Transfer Bank / E-Wallet</span>
                    </button>
                </div>
            </section>

            <!-- 2. Metode Input Data -->
            <section>
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">2. Metode Input Data</h2>
                <div class="grid grid-cols-2 gap-1.5 bg-slate-200/80 p-1.5 rounded-xl">
                    <button type="button" id="tabManual" onclick="setInputMode('manual')" class="py-2.5 px-3 rounded-lg text-xs font-bold transition bg-white text-blue-700 shadow-sm flex items-center justify-center gap-1.5">
                        <span>✍️</span> Input Manual
                    </button>
                    <button type="button" id="tabScreenshot" onclick="setInputMode('screenshot')" class="py-2.5 px-3 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5">
                        <span>📸</span> Ambil dari Screenshot
                    </button>
                </div>

                <!-- Area OCR Screenshot -->
                <div id="screenshotSection" class="hidden mt-3 bg-sky-50 border-2 border-dashed border-sky-300 rounded-xl p-4 text-center transition">
                    <label for="screenshotInput" class="inline-flex items-center gap-2 bg-sky-600 hover:bg-sky-700 active:scale-95 transition text-white px-4 py-2.5 rounded-xl text-xs font-bold cursor-pointer shadow-sm">
                        <span>📁</span> Pilih / Unggah Gambar Screenshot
                    </label>
                    <input type="file" id="screenshotInput" accept="image/*" class="hidden" onchange="processScreenshot(event)">
                    <p class="text-[11px] text-slate-600 mt-2">Unggah bukti transfer, token listrik, atau struk digital untuk mengisi kolom otomatis.</p>
                    
                    <img id="screenshotPreview" class="hidden max-h-48 mx-auto rounded-lg mt-3 border border-sky-200 shadow-sm" alt="Preview Screenshot">
                    <div id="ocrStatus" class="text-xs font-bold text-sky-800 mt-2"></div>
                    
                    <div id="rawOcrContainer" class="hidden text-left mt-3">
                        <label class="block text-[11px] font-bold text-sky-800 mb-1">Teks Terbaca dari Gambar (Bisa disalin jika perlu):</label>
                        <textarea id="rawOcrText" rows="3" readonly class="w-full text-xs bg-white border border-sky-200 rounded-lg p-2 text-slate-700 focus:outline-none"></textarea>
                    </div>
                </div>
            </section>

            <!-- 3. Detail Data Transaksi -->
            <section class="bg-slate-50/80 border border-slate-200/90 rounded-2xl p-4 space-y-3.5">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600">3. Detail Data Transaksi</h2>
                    <button type="button" onclick="resetCurrentForm()" class="text-[11px] font-semibold text-slate-500 hover:text-red-600 transition">Reset Form</button>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Pembeli / Pelanggan</label>
                    <input type="text" id="buyerName" placeholder="Contoh: Bpk. Budi (Kosongkan = Umum)" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/15">
                </div>

                <!-- Form Dinamis Berdasarkan Kategori -->
                <div id="dynamicForm" class="space
