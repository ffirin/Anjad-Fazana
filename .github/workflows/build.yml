name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK via Gradle
        run: |
          cd KasirFazanaAndroid
          
          # Buat wrapper otomatis menggunakan Gradle versi 8.9 sesuai permintaan plugin
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/app-debug.apk"
